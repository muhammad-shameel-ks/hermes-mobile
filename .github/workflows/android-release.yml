name: Android Release

# `main` is the release branch: every push that lands on it builds a release
# APK, bumps the version, updates the changelog and publishes a GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time; never cancel a build that is already running.
concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The version-bump commit this workflow pushes carries [skip ci], which
    # GitHub already honours. This guard is a second line of defence.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          # Build the tip of main, not the commit that triggered the run. Runs
          # queue behind each other, so by the time a queued run starts the
          # previous one has pushed its version bump and tag; starting from the
          # triggering commit would miss both and re-release the same version.
          ref: main
          # Tags drive the version bump, so the whole history is needed.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Versions Expo's Gradle plugin pins for this SDK. `packages` replaces
          # the action's default, so platform-tools is listed explicitly.
          packages: 'platform-tools ndk;27.1.12297006 cmake;3.22.1'

      # Caches Gradle's dependencies, wrapper and build cache between runs.
      # Only builds on main write to the cache, so every release reuses it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The native modules' C++ is most of the build and Gradle cannot cache
      # CMake output, so ccache does it instead.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: android-${{ runner.os }}-
          max-size: 2G

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump the version
        id: version
        run: node scripts/bump-version.mjs

      - name: Update the changelog and release notes
        run: node scripts/changelog.mjs "${{ steps.version.outputs.version }}"

      # android/ is git-ignored and generated, so it is recreated here from
      # app.json and the config plugins on every release.
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      # arm64-v8a only: it covers modern phones, and every extra architecture
      # repeats the whole native compile.
      - name: Build the release APK
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # The NDK is reinstalled each run, so compare compilers by content
          # rather than mtime; headers regenerated each run must not bypass
          # the cache either.
          CCACHE_COMPILERCHECK: content
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: 'true'
          CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,pch_defines
        run: >-
          ./gradlew assembleRelease
          --build-cache
          -PreactNativeArchitectures=arm64-v8a
          -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Report the ccache hit rate
        if: always()
        run: ccache --show-stats

      - name: Collect the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/hermes-${{ steps.version.outputs.version }}.apk"

      - name: Commit the version bump and changelog
        run: |
          git add app.json package.json CHANGELOG.md
          git commit -m "chore(release): v${{ steps.version.outputs.version }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "dist/hermes-${{ steps.version.outputs.version }}.apk" \
            --target "$(git rev-parse HEAD)" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file RELEASE_NOTES.md
